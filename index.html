<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GBP to PKR Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>London to Pakistan</h2>
        <form>
            <div class="amount">
                <p>Enter Amount in GBP</p>
                <input value="1" type="text">
            </div>
            <div class="dropdown">
                <div class="from">
                    <p>From</p>
                    <div class="select-container">
                        <img src="./UK.png">
                        <select name="from">
                            <option value="GBP">GBP</option>
                        </select>
                    </div>
                </div>
                <div class="to">
                    <p>To</p>
                    <div class="select-container">
                        <img src="Pak.png">
                        <select name="to">
                            <option value="PKR">PKR</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="msg">1 GBP = 0 PKR</div>
            <button>Convert</button>
        </form>
    </div>
    <script src="./app.js"></script>
</body>
</html>
